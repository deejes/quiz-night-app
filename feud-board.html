<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Board</title>
<style>
  :root{
    --bg:#060b2e; --tile:#0b1a8a; --tile2:#0d2099; --gold:#ffcf33;
    --text:#fff; --muted:#9fb0ff; --green:#22c55e; --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% -10%,#1b2a9e 0%,var(--bg) 60%);
    color:var(--text);min-height:100vh;padding:18px;
  }
  h1{text-align:center;font-size:2rem;letter-spacing:.04em;margin-bottom:4px;}
  h1 .g{color:var(--gold);}
  .sub{text-align:center;color:var(--muted);margin-bottom:16px;font-size:.9rem;}

  /* setup */
  .setup{max-width:560px;margin:40px auto;background:#0d143f;border-radius:16px;padding:26px;}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label{display:block;font-size:.75rem;color:var(--muted);margin:10px 0 4px;}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #2c399c;background:#070c2e;color:#fff;font-size:1rem;}
  .start{width:100%;margin-top:20px;padding:14px;border:none;border-radius:10px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:1.05rem;cursor:pointer;}

  /* board */
  .board{max-width:1000px;margin:0 auto;display:grid;gap:8px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .cat{
    background:#070c2e;color:var(--gold);font-weight:800;text-transform:uppercase;
    text-align:center;padding:14px 6px;border-radius:8px;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;min-height:64px;letter-spacing:.03em;
  }
  .tile{
    background:linear-gradient(180deg,var(--tile2),var(--tile));border:none;border-radius:8px;
    color:var(--gold);font-size:1.6rem;font-weight:800;padding:20px 6px;cursor:pointer;
    min-height:70px;transition:transform .08s,filter .15s;text-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .tile:hover:not(:disabled){filter:brightness(1.25);transform:translateY(-2px);}
  .tile:disabled{background:#0a0f33;color:#0a0f33;cursor:default;text-shadow:none;}

  /* scores */
  .scores{max-width:1000px;margin:16px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .pchip{background:#0d143f;border:1px solid #2c399c;border-radius:10px;padding:8px 14px;font-size:.95rem;display:flex;gap:8px;align-items:center;}
  .pchip b{color:var(--gold);min-width:30px;text-align:right;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(2,5,20,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .overlay.show{display:flex;}
  .modal{background:linear-gradient(180deg,#0d2099,#0a155f);border-radius:18px;max-width:760px;width:100%;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;}
  .mtop{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.85rem;margin-bottom:14px;}
  .clue{font-size:1.7rem;line-height:1.35;font-weight:600;margin-bottom:10px;min-height:1.4em;}
  .logohint{font-size:3.4rem;margin:6px 0 10px;letter-spacing:.1em;}
  .answer{color:var(--gold);font-size:1.4rem;font-weight:800;margin:18px 0;min-height:1.4em;}
  .hidden{display:none;}
  .revealBtn{padding:12px 26px;border:none;border-radius:10px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:1rem;cursor:pointer;}
  .who{margin-top:6px;color:var(--muted);font-size:.9rem;}
  .award{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .award button{padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .award .corr{background:var(--green);color:#04210f;}
  .award .none{background:#33406b;color:#fff;}
  .award .corr:hover{filter:brightness(1.1);}

  .done{max-width:560px;margin:60px auto;background:#0d143f;border-radius:16px;padding:30px;text-align:center;}
  .podium{list-style:none;margin:18px 0;}
  .podium li{display:flex;justify-content:space-between;padding:12px 16px;border-radius:10px;margin-bottom:8px;background:#070c2e;font-size:1.1rem;}
  .podium li.first{background:linear-gradient(90deg,rgba(255,207,51,.25),#070c2e);border:1px solid var(--gold);}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="setup">
  <h1>Trivia <span class="g">Board</span></h1>
  <p class="sub">Pick a category, pick a value, win the points · 5 players</p>
  <div class="pg">
    <div><label>Player 1</label><input id="p0" value="Devansh"></div>
    <div><label>Player 2</label><input id="p1" value="Player 2"></div>
    <div><label>Player 3</label><input id="p2" value="Player 3"></div>
    <div><label>Player 4</label><input id="p3" value="Player 4"></div>
    <div><label>Player 5</label><input id="p4" value="Player 5"></div>
  </div>
  <button class="start" onclick="startGame()">Start →</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <h1>Trivia <span class="g">Board</span></h1>
  <p class="sub" id="progress"></p>
  <div class="board" id="board"></div>
  <div class="scores" id="scores"></div>
</div>

<!-- DONE -->
<div id="done" class="done hidden">
  <h1>🏆 <span class="g">Final Scores</span></h1>
  <ul class="podium" id="podium"></ul>
  <button class="start" onclick="location.reload()">Play again ↺</button>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mtop" id="mtop"></div>
    <div class="logohint hidden" id="logohint"></div>
    <div class="clue" id="clue"></div>
    <button class="revealBtn" id="revealBtn" onclick="reveal()">Reveal answer</button>
    <div class="answer hidden" id="answerText"></div>
    <div id="awardWrap" class="hidden">
      <div class="who">Who got it? (awards the points)</div>
      <div class="award" id="award"></div>
    </div>
  </div>
</div>

<script>
// Each category: array of 5 clues by value. value = (index+1)*10
// Optional "logo" field shows a big visual hint above the clue.
const CATEGORIES = [
  {
    name:"Logos & Brands",
    clues:[
      {v:10,logo:"🌟",q:"A three-pointed star inside a ring — which German luxury car brand?",a:"Mercedes-Benz"},
      {v:20,logo:"🐎",q:"A prancing black horse on a yellow shield — Italian supercar maker.",a:"Ferrari"},
      {v:30,logo:"🧜‍♀️",q:"A green twin-tailed siren (mermaid) — which global coffee chain?",a:"Starbucks"},
      {v:40,logo:"🐶📯",q:"A little dog listening to an old gramophone horn — classic music/record brand.",a:"HMV (His Master's Voice)"},
      {v:50,logo:"🦁",q:"A standing lion is the badge of which French car manufacturer?",a:"Peugeot"},
    ]
  },
  {
    name:"World Geography",
    clues:[
      {v:10,q:"What is the capital of Australia? (Hint: it's not Sydney.)",a:"Canberra"},
      {v:20,q:"Which country has the largest population in the world?",a:"India"},
      {v:30,q:"The River Nile empties into which sea?",a:"The Mediterranean Sea"},
      {v:40,q:"Which two countries share the longest land border in the world?",a:"The USA and Canada"},
      {v:50,q:"What is the world's largest island (that isn't a continent)?",a:"Greenland"},
    ]
  },
  {
    name:"Movies",
    clues:[
      {v:10,q:"What colour is the ogre Shrek?",a:"Green"},
      {v:20,q:"In Star Wars, who is revealed to be Luke Skywalker's father?",a:"Darth Vader (Anakin Skywalker)"},
      {v:30,q:"Which actor plays Tony Stark / Iron Man in the Marvel films?",a:"Robert Downey Jr."},
      {v:40,q:"What is the highest-grossing film of all time?",a:"Avatar (2009)"},
      {v:50,q:"Which 1994 film features the line 'Life is like a box of chocolates'?",a:"Forrest Gump"},
    ]
  },
  {
    name:"General Knowledge",
    clues:[
      {v:10,q:"How many sides does a hexagon have?",a:"Six"},
      {v:20,q:"What is the largest planet in our solar system?",a:"Jupiter"},
      {v:30,q:"Who painted the Mona Lisa?",a:"Leonardo da Vinci"},
      {v:40,q:"What is the chemical symbol for gold?",a:"Au"},
      {v:50,q:"How many bones are in the adult human body?",a:"206"},
    ]
  },
  {
    name:"Internet & Pop Culture",
    clues:[
      {v:10,q:"What does the abbreviation 'LOL' stand for?",a:"Laughing Out Loud"},
      {v:20,q:"Which messaging app uses a white ghost as its logo and is known for disappearing photos?",a:"Snapchat"},
      {v:30,q:"What single letter is the new name of the platform formerly called Twitter?",a:"X"},
      {v:40,q:"Which streaming service signs on with a 'ta-dum' sound and made Stranger Things?",a:"Netflix"},
      {v:50,q:"In 'ChatGPT', what do the letters 'GPT' stand for?",a:"Generative Pre-trained Transformer"},
    ]
  },
];

let players=[], scores=[], remaining=0, current=null;

function startGame(){
  players=[];
  for(let i=0;i<5;i++){
    players.push(document.getElementById('p'+i).value.trim()||('Player '+(i+1)));
  }
  scores=players.map(()=>0);
  remaining=CATEGORIES.length*5;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  buildBoard();
  renderScores();
  updateProgress();
}

function buildBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  // category header row
  const head=document.createElement('div');
  head.className='row';
  CATEGORIES.forEach(c=>{
    const d=document.createElement('div');
    d.className='cat';d.textContent=c.name;
    head.appendChild(d);
  });
  board.appendChild(head);
  // 5 value rows
  for(let r=0;r<5;r++){
    const row=document.createElement('div');
    row.className='row';
    CATEGORIES.forEach((c,ci)=>{
      const clue=c.clues[r];
      const btn=document.createElement('button');
      btn.className='tile';
      btn.textContent='$'+clue.v;
      btn.onclick=()=>openClue(ci,r,btn);
      row.appendChild(btn);
    });
    board.appendChild(row);
  }
}

function openClue(ci,ri,btn){
  const c=CATEGORIES[ci];
  const clue=c.clues[ri];
  current={btn,value:clue.v};
  document.getElementById('mtop').textContent=`${c.name} — $${clue.v}`;
  const lh=document.getElementById('logohint');
  if(clue.logo){lh.textContent=clue.logo;lh.classList.remove('hidden');}
  else{lh.classList.add('hidden');}
  document.getElementById('clue').textContent=clue.q;
  const at=document.getElementById('answerText');
  at.textContent=clue.a;at.classList.add('hidden');
  document.getElementById('revealBtn').classList.remove('hidden');
  document.getElementById('awardWrap').classList.add('hidden');
  document.getElementById('overlay').classList.add('show');
}

function reveal(){
  document.getElementById('answerText').classList.remove('hidden');
  document.getElementById('revealBtn').classList.add('hidden');
  // build award buttons
  const aw=document.getElementById('award');
  aw.innerHTML='';
  players.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='corr';
    b.textContent=`${p} +$${current.value}`;
    b.onclick=()=>award(i);
    aw.appendChild(b);
  });
  const none=document.createElement('button');
  none.className='none';
  none.textContent='Nobody got it';
  none.onclick=()=>award(-1);
  aw.appendChild(none);
  document.getElementById('awardWrap').classList.remove('hidden');
}

function award(playerIdx){
  if(playerIdx>=0) scores[playerIdx]+=current.value;
  current.btn.disabled=true;
  remaining--;
  document.getElementById('overlay').classList.remove('show');
  renderScores();
  updateProgress();
  if(remaining<=0) setTimeout(showDone,400);
}

function renderScores(){
  const s=document.getElementById('scores');
  s.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='pchip';
    c.innerHTML=`<span>${p}</span><b>$${scores[i]}</b>`;
    s.appendChild(c);
  });
}

function updateProgress(){
  document.getElementById('progress').textContent=`${remaining} clues left on the board`;
}

function showDone(){
  document.getElementById('game').classList.add('hidden');
  const d=document.getElementById('done');
  d.classList.remove('hidden');
  const ranked=players.map((p,i)=>({p,s:scores[i]})).sort((a,b)=>b.s-a.s);
  const medals=['🥇','🥈','🥉','',''];
  const ul=document.getElementById('podium');
  ul.innerHTML='';
  ranked.forEach((r,i)=>{
    const li=document.createElement('li');
    if(i===0)li.className='first';
    li.innerHTML=`<span>${medals[i]||'•'} ${r.p}</span><span style="color:var(--gold);font-weight:700">$${r.s}</span>`;
    ul.appendChild(li);
  });
}
</script>
</body>
</html>
