<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick & Play Quiz</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#141a2e; --panel2:#1b2240;
    --teal:#2dd4bf; --magenta:#f471b5; --gold:#fbbf24;
    --text:#eef2ff; --muted:#8893b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%,rgba(244,113,181,.18),transparent 60%),
      radial-gradient(900px 500px at 10% 10%,rgba(45,212,191,.16),transparent 60%),
      var(--bg);
    color:var(--text);min-height:100vh;padding:20px;
  }
  h1{text-align:center;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;}
  h1 .t{color:var(--teal);} h1 .m{color:var(--magenta);}
  .sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:.92rem;}

  .panel{max-width:880px;margin:0 auto;background:var(--panel);border:1px solid #232a48;border-radius:20px;padding:26px;}

  label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;}
  .players{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px;}
  .players input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2c3358;background:#0c1124;color:#fff;font-size:.95rem;}
  @media(max-width:640px){.players{grid-template-columns:1fr 1fr;}}

  .sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 12px;}
  .sectionhead .count{color:var(--teal);font-weight:700;font-size:.9rem;}

  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .cat-card{
    position:relative;cursor:pointer;user-select:none;text-align:left;
    background:var(--panel2);border:2px solid #2a325c;border-radius:14px;padding:14px 14px 13px;
    transition:transform .08s,border-color .15s,background .15s;
  }
  .cat-card:hover{transform:translateY(-2px);border-color:#46508a;}
  .cat-card .emoji{font-size:1.6rem;}
  .cat-card .nm{font-weight:700;margin-top:6px;font-size:1rem;}
  .cat-card .dsc{color:var(--muted);font-size:.78rem;margin-top:3px;line-height:1.3;}
  .cat-card.on{border-color:var(--teal);background:linear-gradient(180deg,rgba(45,212,191,.14),var(--panel2));}
  .cat-card.on::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--teal);font-weight:900;font-size:1.1rem;}

  .row-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .btn{border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:filter .15s,transform .08s;}
  .btn:active{transform:scale(.98);}
  .btn-main{flex:1;min-width:200px;padding:15px;background:linear-gradient(90deg,var(--teal),#22b8a6);color:#04231f;font-size:1.05rem;}
  .btn-main:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{padding:15px 18px;background:#222a4d;color:var(--text);}

  /* board */
  #game{max-width:1100px;margin:0 auto;}
  .boardwrap{overflow-x:auto;padding-bottom:6px;}
  .board{display:grid;gap:8px;min-width:max-content;}
  .brow{display:grid;gap:8px;}
  .cathead{
    background:var(--panel2);
    color:var(--gold);font-weight:800;text-transform:uppercase;font-size:.78rem;letter-spacing:.03em;
    text-align:center;padding:12px 8px;border-radius:10px;min-height:58px;
    display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #2a325c;
  }
  .tile{
    background:linear-gradient(180deg,#26305e,#1a2247);border:1px solid #313a68;
    color:var(--gold);font-size:1.4rem;font-weight:800;padding:18px 8px;border-radius:10px;cursor:pointer;
    min-height:64px;transition:transform .08s,filter .15s;
  }
  .tile:hover:not(:disabled){filter:brightness(1.3);transform:translateY(-2px);}
  .tile:disabled{background:#0f1428;color:#0f1428;border-color:#161c34;cursor:default;}

  .scores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;}
  .pchip{background:var(--panel);border:1px solid #2c3358;border-radius:12px;padding:8px 14px;font-size:.92rem;display:flex;gap:8px;}
  .pchip b{color:var(--gold);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,7,18,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel2);border:1px solid #46508a;border-radius:18px;max-width:760px;width:100%;padding:32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);}
  .mtop{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;margin-bottom:14px;}
  .logohint{font-size:3.4rem;margin:4px 0 10px;}
  .clue{font-size:1.6rem;line-height:1.35;font-weight:600;margin-bottom:8px;}
  .answer{color:var(--teal);font-size:1.35rem;font-weight:800;margin:18px 0;}
  .hidden{display:none;}
  .revealBtn{padding:12px 26px;border:none;border-radius:10px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:1rem;cursor:pointer;}
  .who{margin-top:6px;color:var(--muted);font-size:.88rem;}
  .award{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .award button{padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.88rem;}
  .award .corr{background:var(--teal);color:#04231f;}
  .award .none{background:#33406b;color:#fff;}
  .award button:disabled{opacity:.35;cursor:default;}

  /* buzzer */
  .buzz{padding:11px 16px;border:2px solid #46508a;border-radius:10px;background:#222a4d;color:#fff;font-weight:700;cursor:pointer;font-size:.95rem;}
  .buzz:hover:not(:disabled){border-color:var(--teal);transform:translateY(-1px);}
  .buzz:disabled{opacity:.3;cursor:default;}
  .queue{margin:14px 0 4px;color:var(--muted);font-size:.9rem;min-height:1.4em;}
  .qitem{display:inline-block;background:#0c1124;border:1px solid #2c3358;border-radius:8px;padding:3px 9px;margin:3px;color:var(--text);}
  .step-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:16px;}
  .btn-ghost-sm{padding:9px 14px;border:none;border-radius:10px;background:#2a3258;color:var(--text);font-weight:600;cursor:pointer;font-size:.85rem;}
  .btn-ghost-sm:hover{filter:brightness(1.15);}
  .turnName{font-size:1.5rem;font-weight:800;margin:6px 0 14px;color:var(--teal);}
  .timerBar{height:12px;background:#0c1124;border-radius:999px;overflow:hidden;border:1px solid #2c3358;}
  .timerFill{height:100%;width:100%;background:var(--teal);transition:width 1s linear,background .3s;}
  .timerNum{font-size:2.4rem;font-weight:900;margin:8px 0 16px;}
  .peek{margin-top:16px;font-size:.84rem;color:var(--muted);}
  #peekAns{color:var(--gold);font-weight:700;margin-left:6px;}
  #outcome{font-size:1.15rem;font-weight:700;margin:8px 0 18px;}

  .done{max-width:520px;margin:50px auto;text-align:center;}
  .podium{list-style:none;margin:18px 0;}
  .podium li{display:flex;justify-content:space-between;padding:13px 18px;border-radius:12px;margin-bottom:9px;background:var(--panel2);font-size:1.1rem;border:1px solid #2a325c;}
  .podium li.first{background:linear-gradient(90deg,rgba(251,191,36,.22),var(--panel2));border-color:var(--gold);}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <h1>Pick <span class="t">&</span> <span class="m">Play</span></h1>
  <p class="sub">Name your players, choose your categories, build your board.</p>
  <div class="panel">
    <label>Players</label>
    <div class="players">
      <input id="p0" value="Devansh">
      <input id="p1" value="Player 2">
      <input id="p2" value="Player 3">
      <input id="p3" value="Player 4">
      <input id="p4" value="Player 5">
    </div>
    <div class="sectionhead">
      <label style="margin:0">Pick your categories (2–6 works best)</label>
      <span class="count" id="count">0 selected</span>
    </div>
    <div class="cats" id="cats"></div>
    <div class="row-btns">
      <button class="btn btn-ghost" onclick="randomPick()">🎲 Surprise me (pick 5)</button>
      <button class="btn btn-main" id="buildBtn" onclick="buildGame()" disabled>Build the board →</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <h1>Pick <span class="t">&</span> <span class="m">Play</span></h1>
  <p class="sub" id="progress"></p>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="scores" id="scores"></div>
  <div style="text-align:center;margin-top:16px;">
    <button class="btn btn-ghost" onclick="location.reload()">↺ New game / pick again</button>
  </div>
</div>

<!-- DONE -->
<div id="done" class="done hidden">
  <h1>🏆 <span class="t">Final</span> <span class="m">Scores</span></h1>
  <ul class="podium" id="podium"></ul>
  <button class="btn btn-main" style="max-width:300px;margin:0 auto;" onclick="location.reload()">Play again ↺</button>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mtop" id="mtop"></div>
    <div class="logohint hidden" id="logohint"></div>
    <div class="clue" id="clue"></div>

    <!-- STEP 1: collect buzz order -->
    <div id="buzzStep">
      <div class="who">Tap players in the order they buzzed in</div>
      <div class="award" id="buzzBtns"></div>
      <div class="queue" id="queueView"></div>
      <div class="step-actions">
        <button class="btn-ghost-sm" onclick="undoBuzz()">↶ Undo</button>
        <button class="btn-ghost-sm" onclick="clearBuzz()">Clear</button>
        <button class="revealBtn" id="startBtn" onclick="startAnswering()" disabled>Start ⏱</button>
        <button class="btn-ghost-sm" onclick="finalize('Skipped — nobody buzzed.')">Skip</button>
      </div>
    </div>

    <!-- STEP 2: answering with timer -->
    <div id="answerStep" class="hidden">
      <div class="turnName" id="turnName"></div>
      <div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
      <div class="timerNum" id="timerNum">10</div>
      <div class="award">
        <button class="corr" id="rightBtn" onclick="judge(true)">✓ Correct</button>
        <button class="none" id="wrongBtn" onclick="judge(false)">✗ Wrong</button>
      </div>
      <div class="peek">
        <button class="btn-ghost-sm" onclick="togglePeek()">👁 Peek answer (host)</button>
        <span id="peekAns" class="hidden"></span>
      </div>
    </div>

    <!-- STEP 3: resolve -->
    <div id="resolveStep" class="hidden">
      <div class="answer" id="answerText"></div>
      <div id="outcome"></div>
      <button class="revealBtn" onclick="closeClue()">Next →</button>
    </div>
  </div>
</div>

<script>
// icon = card emoji (just decoration). clues: 5 entries, value = (i+1)*10.
// logo field (optional) shows a big emoji hint above the clue.
const CATEGORIES = [
  {name:"Logos & Brands", icon:"🏷️", desc:"Guess the brand from its logo", clues:[
    {v:10,logo:"🔵🔗",q:"Audi's four rings represent the 1932 merger of how many car companies?",a:"Four"},
    {v:20,logo:"🐆",q:"Puma was founded by Rudolf Dassler — whose brother started which rival brand?",a:"Adidas (Adolf 'Adi' Dassler)"},
    {v:30,logo:"🐎",q:"Ferrari's prancing horse was adopted from the plane of which WWI flying ace?",a:"Francesco Baracca"},
    {v:40,logo:"🍎",q:"Apple's logo is bitten so it isn't mistaken for what other fruit?",a:"A cherry (the bite gives it scale)"},
    {v:50,logo:"🏔️",q:"Which studio's logo is a mountain circled by stars, the oldest surviving Hollywood studio?",a:"Paramount Pictures"},
  ]},
  {name:"World Geography", icon:"🌍", desc:"Capitals, rivers, borders", clues:[
    {v:10,q:"Which African kingdom is entirely surrounded by South Africa?",a:"Lesotho"},
    {v:20,q:"Which African nation's capital is Ouagadougou?",a:"Burkina Faso"},
    {v:30,q:"Which strait separates Alaska from Russia?",a:"The Bering Strait"},
    {v:40,q:"Which is the largest country in the world with no permanent rivers?",a:"Saudi Arabia"},
    {v:50,q:"Which lake holds around 20% of the world's unfrozen fresh water?",a:"Lake Baikal"},
  ]},
  {name:"Movies", icon:"🎬", desc:"Films, directors, classic lines", clues:[
    {v:10,q:"Which director has won the Best Director Oscar the most times (four)?",a:"John Ford"},
    {v:20,q:"In 'Jaws', what is the name of Quint's fishing boat?",a:"The Orca"},
    {v:30,q:"Which was the first feature-length fully computer-animated film?",a:"Toy Story (1995)"},
    {v:40,q:"'The Matrix' opens with a shot of what falling down the screen?",a:"Green code (digital rain)"},
    {v:50,q:"Which film is the only sequel ever to win Best Picture alongside its predecessor?",a:"The Godfather Part II"},
  ]},
  {name:"Music", icon:"🎵", desc:"Artists, bands, instruments", clues:[
    {v:10,q:"How many strings does a standard classical harp have, roughly?",a:"About 47"},
    {v:20,q:"Which Beatles album features a zebra crossing on its cover?",a:"Abbey Road"},
    {v:30,q:"What Italian term means gradually getting louder?",a:"Crescendo"},
    {v:40,q:"Which composer wrote 'The Four Seasons'?",a:"Antonio Vivaldi"},
    {v:50,q:"In a standard orchestra, which instrument traditionally tunes the rest?",a:"The oboe"},
  ]},
  {name:"Science", icon:"🔬", desc:"Chemistry, biology, physics", clues:[
    {v:10,q:"Which organ produces insulin in the human body?",a:"The pancreas"},
    {v:20,q:"What is the only metal that is liquid at room temperature?",a:"Mercury"},
    {v:30,q:"Which scientist first proposed that continents drift?",a:"Alfred Wegener"},
    {v:40,q:"What is the term for a substance that speeds a reaction without being consumed?",a:"A catalyst"},
    {v:50,q:"What is the name of the force holding an atom's nucleus together?",a:"The strong nuclear force"},
  ]},
  {name:"History", icon:"📜", desc:"Events, leaders, eras", clues:[
    {v:10,q:"Which empire was ruled from the city of Constantinople?",a:"The Byzantine Empire"},
    {v:20,q:"The Magna Carta was sealed by which English king?",a:"King John"},
    {v:30,q:"Which treaty formally ended World War I in 1919?",a:"The Treaty of Versailles"},
    {v:40,q:"Who was the first female Prime Minister of India?",a:"Indira Gandhi"},
    {v:50,q:"The Battle of Hastings took place in which year?",a:"1066"},
  ]},
  {name:"Sports", icon:"⚽", desc:"Rules, records, teams", clues:[
    {v:10,q:"How many players are on a water polo team in the pool?",a:"Seven"},
    {v:20,q:"In golf, what is a score of three under par on a single hole called?",a:"An albatross (double eagle)"},
    {v:30,q:"Which country has hosted the Summer Olympics the most times?",a:"The United States"},
    {v:40,q:"In Formula 1, what colour flag signals the end of a race?",a:"The chequered flag"},
    {v:50,q:"Which boxer famously called himself 'The Greatest'?",a:"Muhammad Ali"},
  ]},
  {name:"Food & Drink", icon:"🍕", desc:"Dishes, ingredients, origins", clues:[
    {v:10,q:"Which part of the crocus flower produces saffron?",a:"The stigma (threads)"},
    {v:20,q:"The word 'pesto' comes from an Italian verb meaning what?",a:"To crush or pound ('pestare')"},
    {v:30,q:"Which country consumes the most coffee per person in the world?",a:"Finland"},
    {v:40,q:"Balsamic vinegar traditionally comes from which Italian city?",a:"Modena"},
    {v:50,q:"Which spirit forms the base of a classic mojito?",a:"White rum"},
  ]},
  {name:"Animals & Nature", icon:"🦁", desc:"Wildlife and the natural world", clues:[
    {v:10,q:"Which mammal has the longest gestation period?",a:"The elephant (about 22 months)"},
    {v:20,q:"What is the only venomous snake native to Britain?",a:"The adder"},
    {v:30,q:"Which bird makes the longest annual migration on Earth?",a:"The Arctic tern"},
    {v:40,q:"How many stomachs does a cow have?",a:"One, with four compartments"},
    {v:50,q:"What is the world's most venomous marine creature?",a:"The box jellyfish"},
  ]},
  {name:"Internet & Pop Culture", icon:"💻", desc:"Apps, memes, modern culture", clues:[
    {v:10,q:"What was the first message ever sent over the internet's predecessor, ARPANET?",a:"'LO' (an attempted 'LOGIN' that crashed)"},
    {v:20,q:"Which website's name comes from a misspelling of the number 10^100?",a:"Google (googol)"},
    {v:30,q:"What was the first video uploaded to YouTube called?",a:"'Me at the zoo'"},
    {v:40,q:"Which social network was originally called 'Twttr'?",a:"Twitter"},
    {v:50,q:"What does the 'S' in HTTPS add to a web connection?",a:"Security (encryption via TLS/SSL)"},
  ]},
  {name:"Space & Astronomy", icon:"🚀", desc:"Planets, stars, exploration", clues:[
    {v:10,q:"Which planet rotates on its side, tipped nearly 98 degrees?",a:"Uranus"},
    {v:20,q:"What is the name of the boundary marking the edge of the Sun's influence?",a:"The heliopause"},
    {v:30,q:"Which two spacecraft, launched in 1977, have left the solar system?",a:"Voyager 1 and Voyager 2"},
    {v:40,q:"What is the brightest star in Earth's night sky?",a:"Sirius"},
    {v:50,q:"What is the term for a star that has collapsed into pure neutrons?",a:"A neutron star"},
  ]},
  {name:"Books & Literature", icon:"📚", desc:"Authors and famous works", clues:[
    {v:10,q:"Which novel's opening line is 'It was the best of times, it was the worst of times'?",a:"A Tale of Two Cities"},
    {v:20,q:"Which author created the fictional county of Yoknapatawpha?",a:"William Faulkner"},
    {v:30,q:"Who wrote 'Things Fall Apart', a landmark of African literature?",a:"Chinua Achebe"},
    {v:40,q:"Which Shakespeare play is the shortest?",a:"The Comedy of Errors"},
    {v:50,q:"Which Russian novel opens 'All happy families are alike'?",a:"Anna Karenina"},
  ]},
  {name:"Technology", icon:"🔌", desc:"Gadgets, companies, acronyms", clues:[
    {v:10,q:"Who is widely regarded as the world's first computer programmer?",a:"Ada Lovelace"},
    {v:20,q:"What does the 'Bluetooth' technology take its name from?",a:"A 10th-century Danish king, Harald Bluetooth"},
    {v:30,q:"What was the name of the first widely used web browser, released in 1993?",a:"Mosaic"},
    {v:40,q:"In computing, how many bytes are in a kilobyte (binary definition)?",a:"1,024"},
    {v:50,q:"What does 'RAID' stand for in data storage?",a:"Redundant Array of Independent Disks"},
  ]},
  {name:"Myths & Legends", icon:"⚡", desc:"Gods, heroes, monsters", clues:[
    {v:10,q:"Which Titan was condemned to hold up the sky for eternity?",a:"Atlas"},
    {v:20,q:"How many labours was Hercules required to complete?",a:"Twelve"},
    {v:30,q:"In Norse myth, what is the name of the final battle that ends the world?",a:"Ragnarök"},
    {v:40,q:"Which Greek figure was cursed to always be right but never believed?",a:"Cassandra"},
    {v:50,q:"In Egyptian belief, the heart was weighed against what at judgement?",a:"A feather (of Ma'at, truth)"},
  ]},
];

const selected = new Set();
let players=[], scores=[], chosen=[], remaining=0, current=null;

// ---- setup: render category cards ----
function renderCats(){
  const wrap=document.getElementById('cats');
  wrap.innerHTML='';
  CATEGORIES.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='cat-card'+(selected.has(i)?' on':'');
    card.innerHTML=`<div class="emoji">${c.icon}</div><div class="nm">${c.name}</div><div class="dsc">${c.desc}</div>`;
    card.onclick=()=>toggleCat(i);
    wrap.appendChild(card);
  });
  updateCount();
}
function toggleCat(i){
  if(selected.has(i)) selected.delete(i); else selected.add(i);
  renderCats();
}
function updateCount(){
  document.getElementById('count').textContent=`${selected.size} selected`;
  document.getElementById('buildBtn').disabled = selected.size < 2;
}
function randomPick(){
  selected.clear();
  const idx=[...CATEGORIES.keys()];
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  idx.slice(0,5).forEach(i=>selected.add(i));
  renderCats();
}

// ---- build & play ----
function buildGame(){
  players=[];
  for(let i=0;i<5;i++) players.push(document.getElementById('p'+i).value.trim()||('Player '+(i+1)));
  scores=players.map(()=>0);
  chosen=[...selected].sort((a,b)=>a-b).map(i=>CATEGORIES[i]);
  remaining=chosen.length*5;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  buildBoard();renderScores();updateProgress();
}

function buildBoard(){
  const board=document.getElementById('board');
  const cols=`repeat(${chosen.length}, minmax(150px,1fr))`;
  board.innerHTML='';
  const head=document.createElement('div');
  head.className='brow';head.style.gridTemplateColumns=cols;
  chosen.forEach(c=>{
    const d=document.createElement('div');d.className='cathead';
    d.innerHTML=`<span>${c.icon}</span><span>${c.name}</span>`;
    head.appendChild(d);
  });
  board.appendChild(head);
  for(let r=0;r<5;r++){
    const row=document.createElement('div');
    row.className='brow';row.style.gridTemplateColumns=cols;
    chosen.forEach((c,ci)=>{
      const clue=c.clues[r];
      const btn=document.createElement('button');
      btn.className='tile';btn.textContent='$'+clue.v;
      btn.onclick=()=>openClue(ci,r,btn);
      row.appendChild(btn);
    });
    board.appendChild(row);
  }
}

// ---- buzzer round state machine ----
function openClue(ci,ri,btn){
  const c=chosen[ci], clue=c.clues[ri];
  current={btn,value:clue.v,clue,queue:[],idx:0,timer:null,timeLeft:10,done:false};
  document.getElementById('mtop').textContent=`${c.name} — $${clue.v}`;
  const lh=document.getElementById('logohint');
  if(clue.logo){lh.textContent=clue.logo;lh.classList.remove('hidden');}else{lh.classList.add('hidden');}
  document.getElementById('clue').textContent=clue.q;
  // reset steps
  document.getElementById('buzzStep').classList.remove('hidden');
  document.getElementById('answerStep').classList.add('hidden');
  document.getElementById('resolveStep').classList.add('hidden');
  document.getElementById('startBtn').disabled=true;
  renderBuzzButtons();
  renderQueue();
  document.getElementById('overlay').classList.add('show');
}

function renderBuzzButtons(){
  const wrap=document.getElementById('buzzBtns');wrap.innerHTML='';
  players.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='buzz';b.textContent=p;b.dataset.i=i;
    b.onclick=()=>buzz(i,b);
    wrap.appendChild(b);
  });
}
function buzz(i,btn){
  if(current.queue.includes(i))return;
  current.queue.push(i);
  btn.disabled=true;
  renderQueue();
  document.getElementById('startBtn').disabled=current.queue.length===0;
}
function renderQueue(){
  const q=document.getElementById('queueView');
  if(!current.queue.length){q.innerHTML='<span style="opacity:.6">No one buzzed yet…</span>';return;}
  q.innerHTML='Buzz order: '+current.queue.map((pi,n)=>`<span class="qitem">${n+1}. ${players[pi]}</span>`).join(' ');
}
function undoBuzz(){
  const i=current.queue.pop();
  if(i===undefined)return;
  document.querySelectorAll('#buzzBtns button').forEach(b=>{if(+b.dataset.i===i)b.disabled=false;});
  renderQueue();
  document.getElementById('startBtn').disabled=current.queue.length===0;
}
function clearBuzz(){
  current.queue=[];
  document.querySelectorAll('#buzzBtns button').forEach(b=>b.disabled=false);
  renderQueue();
  document.getElementById('startBtn').disabled=true;
}

function startAnswering(){
  if(!current.queue.length)return;
  document.getElementById('buzzStep').classList.add('hidden');
  document.getElementById('answerStep').classList.remove('hidden');
  document.getElementById('peekAns').classList.add('hidden');
  current.idx=0;
  beginTurn();
}
function beginTurn(){
  const pi=current.queue[current.idx];
  const tn=document.getElementById('turnName');
  tn.textContent=`${players[pi]} — answer now!`;tn.style.color='var(--teal)';
  document.getElementById('rightBtn').disabled=false;
  document.getElementById('wrongBtn').disabled=false;
  document.getElementById('peekAns').classList.add('hidden');
  current.timeLeft=10;updateTimer();
  clearInterval(current.timer);
  current.timer=setInterval(tick,1000);
}
function tick(){
  current.timeLeft--;updateTimer();
  if(current.timeLeft<=0){
    clearInterval(current.timer);
    const tn=document.getElementById('turnName');
    tn.textContent="⏱ Time's up!";tn.style.color='var(--magenta)';
    document.getElementById('rightBtn').disabled=true;
    document.getElementById('wrongBtn').disabled=true;
    setTimeout(nextOrResolve,900);
  }
}
function updateTimer(){
  const t=Math.max(0,current.timeLeft);
  document.getElementById('timerNum').textContent=t;
  const fill=document.getElementById('timerFill');
  fill.style.width=(t/10*100)+'%';
  fill.style.background = t<=3 ? 'var(--magenta)' : 'var(--teal)';
}
function judge(correct){
  clearInterval(current.timer);
  const pi=current.queue[current.idx];
  if(correct){
    scores[pi]+=current.value;renderScores();
    finalize(`✓ ${players[pi]} got it! +$${current.value}`);
  }else{
    const pen=Math.round(current.value/2);
    scores[pi]-=pen;renderScores();
    nextOrResolve();
  }
}
function nextOrResolve(){
  current.idx++;
  if(current.idx<current.queue.length) beginTurn();
  else finalize('Nobody got it.');
}
function togglePeek(){
  const el=document.getElementById('peekAns');
  el.textContent='→ '+current.clue.a;
  el.classList.toggle('hidden');
}

function finalize(msg){
  clearInterval(current.timer);
  document.getElementById('buzzStep').classList.add('hidden');
  document.getElementById('answerStep').classList.add('hidden');
  document.getElementById('resolveStep').classList.remove('hidden');
  document.getElementById('answerText').textContent='Answer: '+current.clue.a;
  document.getElementById('outcome').textContent=msg;
  if(!current.done){current.btn.disabled=true;remaining--;current.done=true;updateProgress();}
}
function closeClue(){
  document.getElementById('overlay').classList.remove('show');
  if(remaining<=0) setTimeout(showDone,350);
}

function renderScores(){
  const s=document.getElementById('scores');s.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='pchip';
    c.innerHTML=`<span>${p}</span><b>$${scores[i]}</b>`;
    s.appendChild(c);
  });
}
function updateProgress(){document.getElementById('progress').textContent=`${remaining} clues left · ${chosen.length} categories in play`;}

function showDone(){
  document.getElementById('game').classList.add('hidden');
  const d=document.getElementById('done');d.classList.remove('hidden');
  const ranked=players.map((p,i)=>({p,s:scores[i]})).sort((a,b)=>b.s-a.s);
  const medals=['🥇','🥈','🥉','',''];
  const ul=document.getElementById('podium');ul.innerHTML='';
  ranked.forEach((r,i)=>{
    const li=document.createElement('li');if(i===0)li.className='first';
    li.innerHTML=`<span>${medals[i]||'•'} ${r.p}</span><span style="color:var(--gold);font-weight:700">$${r.s}</span>`;
    ul.appendChild(li);
  });
}

renderCats();
</script>
</body>
</html>
